# 監視対象の自治体一覧
# min_consecutive_blocks:       この枠数以上連続して空いている場合に通知
# always_notify_block_indexes:  1枠だけでも通知したい枠(0始まりの番号)
# facility_filters:             施設名にこの文字列を含む施設だけを対象にする(省略時は全施設)
# facility_excludes:            施設名にこの文字列を含む施設を対象から除外する(facility_filtersと併用可)
targets:
  - municipality: ome
    name: 青梅市
    reservation_url: "https://k4.p-kashikan.jp/ome-city/index.php"
    sport_code: "037"             # バレーボール
    # 1日6枠: 9-12 / 12-13 / 13-15 / 15-17 / 17-19 / 19-21
    min_consecutive_blocks: 3
    always_notify_block_indexes: []
    # 天ヶ瀬体育館は分割面(1/2A・1/2B)を除外し、全面のみ通知する
    facility_excludes: ["瀬体育館1/2"]

  - municipality: koto
    name: 江東区
    reservation_url: "https://yoyaku.koto-sports.net/"
    sport_code: "2"               # バレーボール
    # 1日3枠: 9-12 / 13-17 / 18-21:30
    min_consecutive_blocks: 2
    always_notify_block_indexes: [1]   # 13:00-17:00 は1枠でも通知

  - municipality: arakawa
    name: 荒川区
    reservation_url: "https://shisetsu.city.arakawa.tokyo.jp/stagia/reserve/gin_menu"
    sport_code: "250"             # バレーボール
    # 1日4枠: 9-12 / 12:30-15 / 15:30-18 / 18:30-21:30
    min_consecutive_blocks: 2
    always_notify_block_indexes: []
    facility_filters: ["大体育室全面", "小体育室"]   # 荒川総合スポーツセンターのみ

  - municipality: katsushika
    name: 葛飾区
    reservation_url: "https://rsv.shisetsu.city.katsushika.lg.jp/katsushika/web/"
    sport_code: "バレーボール"     # 利用目的名(館ごとの例外は scrapers/katsushika.py)
    # 時間枠は館ごとに異なる(奥戸=4枠、水元=5枠)ため画面から読み取る
    # 対象は 奥戸体育館の大体育室全面 / エイトホール / 水元のメインアリーナ全面
    min_consecutive_blocks: 2
    always_notify_block_indexes: []

  - municipality: adachi
    name: 足立区
    reservation_url: "https://k5.p-kashikan.jp/adachi-ku/"
    sport_code: "021"             # バレーボール
    # 1日4枠: 9-12 / 12:30-15 / 15:30-18 / 18:30-21
    min_consecutive_blocks: 2
    always_notify_block_indexes: []
    # バレーボール2面以上使える館の「全面」のみ(半面A/半面B等の分割面は除外)
    facility_filters:
      - "中央本町地域学習センター 体育館 全面"
      - "東和地域学習センター 体育館 全面"
      - "江北地域学習センター 体育館 全面"
      - "鹿浜地域学習センター 体育館 全面"
      - "梅田地域学習センター 体育館 全面"
      - "総合スポーツセンター 大体育室　全面"

  - municipality: matsudo
    name: 松戸市
    reservation_url: "https://yoyaku.city.matsudo.chiba.jp/web/"
    sport_code: "2000_2040"       # バレーボール
    # 1日6枠(2時間単位): 9-11 / 11-13 / 13-15 / 15-17 / 17-19 / 19-21
    # 対象は小金原・柿ノ木台・常盤平・松戸運動公園の体育館の「全面」のみ
    # (scrapers/matsudo.py の TARGET_ROOMS で指定)
    min_consecutive_blocks: 2
    always_notify_block_indexes: []

  - municipality: ichikawa
    name: 市川市
    reservation_url: "https://reserve.city.ichikawa.lg.jp/"
    sport_code: ""                # 種目指定のないシステムのため未使用
    # 1日6枠(2時間単位): 9-11 / 11-13 / 13-15 / 15-17 / 17-19 / 19-21
    # 対象は国府台・信篤の体育館のみ、かつ「全面」だけ(scrapers/ichikawa.py で指定)
    min_consecutive_blocks: 2
    always_notify_block_indexes: []

# 対象曜日: 土日祝のみ空きをチェックする
target_weekdays:
  saturday: true
  sunday: true
  holiday: true

# 何日先まで空き状況をチェックするか
lookahead_days: 60
